[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "student-dictation"
version = "0.1.0"
description = "Private, local desktop dictation and English translation with Whisper"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Student Dictation contributors" }]
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "sounddevice>=0.5,<0.6",
  "numpy>=1.26,<3",
  "faster-whisper>=1.2.1,<2",
  "av>=11,<19",
  "huggingface-hub>=0.34,<2",
  "pynput>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
student-dictation = "student_dictation.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/student_dictation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
